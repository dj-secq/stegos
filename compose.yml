name: stego-triage

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stego-triage:0.2.0
    container_name: stego-triage
    ports:
      - "127.0.0.1:8786:8766"
    volumes:
      - ./runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/stego:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    restart: "no"
    networks:
      - isolated

networks:
  isolated:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
